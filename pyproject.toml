[project]
name = "devlog"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "questionary>=2.0",
    "GitPython>=3.1",
    "requests>=2.31",
    "moviepy>=1.0",
    "edge-tts>=6.0",
    "opencv-python>=4.8",
    "pyaudio>=0.2",
    "webrtcvad>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
devlog = "devlog.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]